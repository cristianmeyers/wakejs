<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAKEJS | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="assets/style/style.css">
</head>

<body
    class="bg-gray-100 dark:bg-slate-950 min-h-screen font-sans text-gray-800 dark:text-gray-100 transition-colors duration-300">

    <div id="loginOverlay"
        class="fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-md flex items-center justify-center hidden">
        <div
            class="bg-white dark:bg-slate-800 p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-gray-200 dark:border-white/10 transform transition-all scale-100">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-black italic tracking-tighter mb-2">WAKE<span class="text-blue-500">JS</span>
                </h2>
                <p class="text-[10px] uppercase tracking-[0.3em] font-bold text-gray-400">Authentification Requise</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div class="relative">
                    <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="username" placeholder="Identifiant"
                        class="w-full bg-gray-50 dark:bg-slate-900 border-2 border-transparent focus:border-blue-500 py-4 pl-12 pr-6 rounded-2xl outline-none transition-all text-sm font-bold"
                        required>
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="password" placeholder="Mot de passe"
                        class="w-full bg-gray-50 dark:bg-slate-900 border-2 border-transparent focus:border-blue-500 py-4 pl-12 pr-6 rounded-2xl outline-none transition-all text-sm font-bold"
                        required>
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-xl shadow-blue-500/20 uppercase tracking-widest text-xs">
                    Connexion
                </button>
            </form>
            <div id="loginError" class="mt-4 text-center text-red-500 text-xs font-bold hidden">
                Identifiants incorrects ou serveur injoignable
            </div>
        </div>
    </div>

    <header
        class="bg-gradient-to-br from-blue-950 via-blue-900 to-blue-800 dark:from-black dark:to-slate-900 text-white pt-8 pb-12 shadow-2xl relative">
        <div class="container mx-auto px-4 flex justify-between items-center relative z-10">
            <div>
                <h1 class="text-4xl font-black tracking-tighter italic">WAKE<span class="text-blue-400">JS</span></h1>
                <p
                    class="text-blue-300 dark:text-blue-400/70 text-[10px] uppercase tracking-[0.2em] font-bold opacity-70">
                    Administration centralisée du Wake On Lan</p>
            </div>
            <div class="flex items-center gap-3">
                <div id="themeToggleContainer"></div>
                <div
                    class="flex items-center gap-3 bg-black/20 dark:bg-white/5 backdrop-blur-md border border-white/10 px-4 py-2 rounded-2xl shadow-inner h-10">
                    <div class="relative flex items-center justify-center h-4 w-4">
                        <span id="apiStatusPing"
                            class="absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                        <span id="apiStatusDot"
                            class="relative inline-flex rounded-full h-2.5 w-2.5 border border-blue-950 bg-gray-500"></span>
                    </div>
                    <p id="apiStatusText"
                        class="text-[11px] font-mono font-black text-blue-100 leading-none tracking-wider pt-0.5 uppercase">
                        VÉRIFICATION...</p>
                </div>
                <button id="logoutBtn"
                    class="bg-white/10 hover:bg-red-500/20 hover:text-red-400 text-white/50 w-10 h-10 rounded-2xl border border-white/10 transition-all flex items-center justify-center">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12 -mt-8">
        <section class="mb-8 relative z-30">
            <div class="relative group max-w-2xl mx-auto">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                    <i
                        class="fas fa-search text-blue-500 dark:text-blue-400 group-focus-within:text-blue-600 transition-colors"></i>
                </div>
                <input type="text" id="globalSearch" placeholder="Rechercher un poste, une IP ou une salle..."
                    class="w-full bg-white dark:bg-slate-900 border-2 border-transparent dark:border-slate-800 rounded-2xl py-4 pl-14 pr-6 text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all shadow-xl text-lg">
                <div id="searchResults"
                    class="absolute w-full mt-2 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-slate-800 hidden overflow-hidden ring-1 ring-black/5 z-50">
                </div>
            </div>
        </section>

        <section
            class="mb-10 bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-slate-800">
            <h2 class="text-xl font-bold mb-6 flex items-center text-gray-700 dark:text-gray-300">
                <span
                    class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center mr-3 shadow-lg shadow-blue-200 dark:shadow-none">
                    <i class="fas fa-sitemap"></i>
                </span>
                Départements
            </h2>
            <div id="deptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </section>

        <section id="sectionSalles"
            class="mb-10 hidden bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-gray-200 dark:border-slate-800">
            <h2 class="text-xl font-bold mb-6 flex items-center text-gray-700 dark:text-gray-300">
                <span
                    class="bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center mr-3 shadow-lg shadow-blue-200 dark:shadow-none">
                    <i class="fas fa-door-open"></i>
                </span>
                Salles
            </h2>
            <div id="sallesGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-4"></div>
        </section>

        <section id="sectionHosts" class="hidden">
            <div
                class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-gray-200 dark:border-slate-800 rounded-3xl px-8 py-5 mb-10 flex flex-col md:flex-row justify-between items-center gap-6 shadow-xl shadow-blue-900/5 dark:shadow-black/20">
                <div class="flex items-center gap-6">
                    <span
                        class="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-200 dark:shadow-none shrink-0">
                        <i class="fas fa-terminal text-xl"></i>
                    </span>
                    <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                        <h2 id="labelSalle"
                            class="text-3xl font-black text-blue-600 dark:text-blue-400 tracking-tight leading-none italic uppercase leading-none">
                            --</h2>
                        <div id="hostCounter"
                            class="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-[0.2em] pt-1 italic leading-none">
                            REPORT</div>
                    </div>
                </div>
                <div class="flex gap-3 w-full md:w-auto">
                    <button id="pingBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-8 py-3.5 rounded-2xl font-bold transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-blue-200 dark:shadow-none">
                        <i class="fas fa-sync-alt"></i><span>PING</span>
                    </button>
                    <button id="wakeBtn"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white px-8 py-3.5 rounded-2xl font-bold transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-green-200 dark:shadow-none">
                        <i class="fas fa-bolt"></i><span>WAKE</span>
                    </button>
                    <button id="shutdownBtn"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white px-8 py-3.5 rounded-2xl font-bold transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-red-200 dark:shadow-none">
                        <i class="fas fa-power-off"></i><span>OFF</span>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center mb-6 px-2 text-gray-400 dark:text-gray-500">
                <h3 class="font-bold uppercase text-xs tracking-widest">Postes de travail</h3>
                <button id="selectAllBtn"
                    class="text-xs font-black text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/40 transition-all uppercase tracking-tighter">
                    <i class="fas fa-check-double mr-2"></i>Tout sélectionner
                </button>
            </div>
            <div id="hostsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6"></div>
        </section>
    </main>
    <div id="sshModal"
        class="fixed inset-0 z-[110] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center hidden">
        <div
            class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] shadow-2xl border border-white/10 overflow-hidden transform transition-all">
            <div class="p-8">
                <div class="flex items-center gap-4 mb-6">
                    <div
                        class="w-12 h-12 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-500 text-xl">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-xl tracking-tight">Authentification SSH</h3>
                        <p class="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Installation de clé</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] uppercase font-black text-gray-400 ml-2 mb-2 block">Système
                            d'exploitation</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button id="osWin"
                                class="os-choice p-4 rounded-2xl border-2 border-gray-100 dark:border-slate-700 flex flex-col items-center gap-2 hover:border-blue-500 transition-all group active"
                                data-os="windows">
                                <i class="fab fa-windows text-2xl text-gray-400 group-[.active]:text-blue-500"></i>
                                <span
                                    class="text-[10px] font-black group-[.active]:text-blue-500 uppercase">Windows</span>
                            </button>
                            <button id="osLin"
                                class="os-choice p-4 rounded-2xl border-2 border-gray-100 dark:border-slate-700 flex flex-col items-center gap-2 hover:border-blue-500 transition-all group"
                                data-os="linux">
                                <i class="fab fa-linux text-2xl text-gray-400 group-[.active]:text-blue-500"></i>
                                <span
                                    class="text-[10px] font-black group-[.active]:text-blue-500 uppercase">Linux</span>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-black text-gray-400 ml-2 mb-2 block">
                            Mot de passe admin
                        </label>
                        <input type="password" id="sshPass" placeholder="••••••••" autocomplete="new-password"
                            spellcheck="false"
                            class="w-full bg-gray-50 dark:bg-slate-900 border-2 border-transparent focus:border-blue-500 p-4 rounded-2xl outline-none font-bold text-sm transition-all">
                    </div>
                </div>

                <div class="flex gap-3 mt-8">
                    <button id="closeSshModal"
                        class="flex-1 py-4 rounded-2xl font-black text-xs uppercase tracking-widest text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all">Annuler</button>
                    <button id="confirmSshBtn"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-500/20 transition-all">Confirmer</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
